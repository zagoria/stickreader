; reTerminal Sticky — Arabic Tutor firmware
; Board settings per Seeed's own starter projects (32MB flash, octal PSRAM)
[env:sticky]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 32MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    ; Add the SD, display and touch libraries here once you've picked the
    ; driver source per firmware/README_DRIVERS.md — left out deliberately
    ; so this file doesn't silently pin a library I haven't verified works
    ; with this exact panel.
build_flags =
    -D CORE_DEBUG_LEVEL=3
